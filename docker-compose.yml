services:
  voice-to-text:
    build: .
    container_name: voice-to-text
    restart: always
    ports:
      - "3080:3080"
    environment:
      - PORT=3080
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
